# SR-11 — the pure test suites, on every push and pull request.
#
# Until this existed, "a test nobody runs" was the norm: 21 runners including
# test_buttonmatcher_parity, which pins this repo's scoring constants, rerank
# weights and detector against buttonmatcher's.  Nothing else can catch that
# drift, because the two copies live in different repositories and a comment
# promising "mirrors buttonmatcher EXACTLY" cannot fail.
#
# torch and CLIP stay OUT.  They are ~2 GB, they are what makes the full suite
# unrunnable in a web session, and nothing the runners assert needs them — the
# detector, the geometry, the scoring constants and every pure module are
# numpy/cv2/Pillow/openpyxl at most.  A suite that needed torch would be a suite that
# stopped running here, which is the failure this workflow exists to end.
name: tests

on:
  push:
  pull_request:

jobs:
  pure-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # matches the Cloud Run runtime

      - name: Install the test dependencies
        # Deliberately not requirements.txt: that file pins torch+CLIP for the
        # deployed image.  This is the set the suites actually import, measured
        # in a clean venv rather than assumed — openpyxl for the goal-tracker
        # repair suite, requests for the eBay/Etsy clients, slack_sdk for the
        # alert renderer, gspread for the buy-rules parser, pyflakes for
        # test_no_unbound_names.  That last one SKIPS itself when pyflakes is
        # absent, so until this line it was a guard that never ran — the exact
        # failure this workflow exists to end, and the guard whose absence cost
        # this service two months of label sidecars.
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy opencv-python-headless Pillow openpyxl \
                      requests slack_sdk gspread pyflakes

      - name: Run the test suite
        # pytest over the whole tests/ tree, NOT the run_*.py loop this used to
        # be.  That loop only ran modules somebody had written a runner for, so
        # 249 tests here — test_main's 82 among them — never ran at all, which
        # is precisely the "suite that quietly stops running" this workflow
        # exists to catch.  It was catching it for the modules it knew about and
        # silent about the rest.
        #
        # requests, slack_sdk and gspread are in the install list rather than in
        # the ignore list: together they are ~5 s and 26 real tests — the eBay
        # and Etsy clients, the deal-alert renderer and the buy-rules parser —
        # and "keep the deployed stack out" is about torch and the GCP clients,
        # not about every third-party import.
        #
        # The two ignores are the modules that genuinely need the heavy stack.
        # They are named here rather than implied by a missing runner, so the
        # skipped set is visible and has to be argued for:
        #   test_clip_matcher   torch + CLIP (~2 GB)
        #   test_seen_items     google-cloud-storage
        # -rs prints the reason for every skip, so a test that stops running
        # inside a collected module is visible too.
        run: |
          python -m pytest ebayscout/tests -q -rs \
            --ignore=ebayscout/tests/test_clip_matcher.py \
            --ignore=ebayscout/tests/test_seen_items.py

      - name: Run the standalone runners
        # The same tests again through the no-pytest path, because that is how
        # they are run in a web session and the runners must keep working.
        run: |
          set -u
          failed=""
          for f in ebayscout/tests/run_*.py; do
            if python "$f" >/dev/null; then :; else failed="$failed $f"; fi
          done
          if [ -n "$failed" ]; then echo "FAILED:$failed"; exit 1; fi
          echo "All runners passed."
